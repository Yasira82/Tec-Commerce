name: E2E Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'e2e/**'               # ✅
      - 'playwright.config.ts' # ✅
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

# One run per ref. Pushing again to a PR branch cancels the superseded run
# instead of racing it: the last commit is the only one anyone reads, and
# without this every intermediate push paid for a full pipeline — CI's five
# jobs, a CodeQL analysis, a Playwright install-build-and-run — that was
# obsolete before it finished.
#
# `main` is EXCLUDED from cancellation on purpose: a run there is the
# post-merge record (and the status a deploy gate reads). Cancelling those
# would trade money for the one signal worth keeping.
#
# This expression is copied verbatim from `tec-knowledge-base`
# knowledge-ci.yml — the fleet had TWO forms of this rule and the other one
# (tec-app, `cancel-in-progress: true`) cancels main runs as well. One rule,
# one spelling (P2).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}


permissions:
  contents: read

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-commerce-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-commerce-

      - name: Install
        run: npm install --legacy-peer-deps

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_GATEWAY_URL: 'http://localhost:8080'
          NEXT_PUBLIC_PI_SANDBOX:      'true'
          NEXT_PUBLIC_HUB_URL:         'https://hub.tecosystem.app'
          NEXT_PUBLIC_COMMERCE_URL:    'https://commerce.tecosystem.app'
          E2E_MODE:                    'true'

      - name: Copy static files
        run: |
          cp -r .next/static .next/standalone/.next/static
          if [ -d "public" ]; then
            cp -r public .next/standalone/public
          else
            mkdir -p .next/standalone/public
          fi

      - name: Run E2E
        run: npm run test:e2e
        continue-on-error: true
        env:
          CI:                          'true'
          E2E_MODE:                    'true'
          PLAYWRIGHT_BASE_URL:         'http://localhost:3000'
          NEXT_PUBLIC_API_GATEWAY_URL: 'http://localhost:8080'

      - name: Upload Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-commerce
          path: playwright-report/
          retention-days: 7
