name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package*.json'
      - 'tsconfig.json'
      - 'next.config.js'
      - 'vitest.config.ts'
      - 'eslint.config.mjs'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    name: Lint + Typecheck + Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Payment contract policy (ADR-009)
        run: |
          violations=0
          if grep -rniE 'x-service-secret|SERVICE_SECRET' src; then
            echo "::error::ADR-009: use x-internal-key / INTERNAL_SECRET (not x-service-secret / SERVICE_SECRET)"
            violations=1
          fi
          if grep -rnE 'amount:[[:space:]]*z\.string' src | grep -qi payment; then
            echo "::error::ADR-009: payment amount must be a number — no z.string() for amount in payment routes"
            violations=1
          fi
          [ "$violations" -eq 0 ] && echo "payment contract policy OK" || exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-commerce-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-commerce-

      - name: Install
        run: npm install --legacy-peer-deps

      - name: Security audit (advisory)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Clear TS cache
        run: rm -f tsconfig.tsbuildinfo

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_PI_SANDBOX:   'true'
          NEXT_PUBLIC_HUB_URL:      'https://hub.tecosystem.app'
          NEXT_PUBLIC_COMMERCE_URL: 'https://commerce.tecosystem.app'
          NEXT_PUBLIC_PI_APP_ID:    ${{ secrets.NEXT_PUBLIC_PI_APP_ID || 'commerce-app-id' }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: commerce-build
          path: .next/
          retention-days: 3
