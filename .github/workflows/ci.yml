name: CI
# v1.2.1
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package*.json'
      - 'tsconfig.json'
      - 'next.config.js'
      - 'vitest.config.ts'
      - 'eslint.config.mjs'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    name: Lint + Typecheck + Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-commerce-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-commerce-

      - name: Install
        run: npm install --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Clear TS cache
        run: rm -f tsconfig.tsbuildinfo

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_PI_SANDBOX:   'true'
          NEXT_PUBLIC_HUB_URL:      'https://hub.tecosystem.app'
          NEXT_PUBLIC_COMMERCE_URL: 'https://commerce.tecosystem.app'
          NEXT_PUBLIC_PI_APP_ID:    ${{ secrets.NEXT_PUBLIC_PI_APP_ID || 'commerce-app-id' }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: commerce-build
          path: .next/
          retention-days: 3
